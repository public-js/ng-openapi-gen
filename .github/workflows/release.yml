name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Release type'
        required: true
        default: 'minor'
        options:
          - patch
          - minor
          - major
          - beta

permissions:
  id-token: write
  contents: write

jobs:
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.BM_GITHUB_PAT }}
          fetch-depth: 0

      - name: Validate release mode for branch
        run: |
          case "${{ github.ref_name }}:${{ github.event.inputs.mode }}" in
            main:patch|main:minor|main:major|beta:beta)
              ;;
            beta:patch|beta:minor|beta:major)
              echo "Stable releases are only allowed from the main branch." >&2
              exit 1
              ;;
            main:beta)
              echo "The beta release mode is only allowed from the beta branch." >&2
              exit 1
              ;;
            *)
              echo "Unsupported release request for branch ${{ github.ref_name }}." >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js and cache
        uses: ./.github/actions/nodejs

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.BM_GPG_PRIVATE }}
          passphrase: ${{ secrets.BM_GPG_PASS }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Bump packages version
        id: bump-version
        run: |
          npm run cd:prepare-release -- ${{ github.event.inputs.mode }}
          echo "new_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --access public --tag ${{ github.event.inputs.mode == 'beta' && 'rc' || 'latest' }}

      - name: Commit changes after bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: release v${{ steps.bump-version.outputs.new_version }}'
          commit_options: '--no-verify'
          commit_user_name: 'Blue Muffin'
          commit_user_email: '69810118+blue-muffin@users.noreply.github.com'
          commit_author: 'Blue Muffin <69810118+blue-muffin@users.noreply.github.com>'
          tagging_message: ${{ steps.bump-version.outputs.new_version }}
          status_options: '--untracked-files=no'
          skip_fetch: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump-version.outputs.new_version }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.mode == 'beta' }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true
